services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: robotics-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: robotics-frontend
    ports:
      - "3000:5173"  # Maps port 3000 on your computer to Vite's 5173 inside container
    depends_on:
      - backend
    restart: unless-stopped
